<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Supabase Signup</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Sign Up</h2>
  <form id="signup-form">
    <label>Email:</label><br>
    <input type="email" id="email" required><br><br>
    <label>Password:</label><br>
    <input type="password" id="password" required><br><br>
    <button type="submit">Sign Up</button>
    <button id="resend">Resend Confirmation Email</button>
  </form>

  <p id="message"></p>

  <script>
    // Initialize Supabase
    const { createClient } = supabase;
    const SUPABASE_URL="https://snjrxzhameuohspuvtuo.supabase.co"
    const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuanJ4emhhbWV1b2hzcHV2dHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE5MDc3OTMsImV4cCI6MjA2NzQ4Mzc5M30.GKtzura6XBELlbAx9mnV9QO0rtPuWm9OD5AU936aWcg"

    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


    // Handle form submission
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            role: "user"
          }
        }
      });

      if (error) {
        document.getElementById('message').textContent = 'Error: ' + error.message;
      } else {
        document.getElementById('message').textContent = 'Signup successful! Check your email to confirm.';
      }
    });
    document.getElementById('resend').addEventListener('click', async () => {
      const email = prompt("Enter your email address to resend the confirmation:");
      const { error } = await supabaseClient.auth.resend({
        type: 'signup',
        email: email
      });

      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Confirmation email resent! Check your inbox.");
      }
  });
  </script>
</body>
</html>
