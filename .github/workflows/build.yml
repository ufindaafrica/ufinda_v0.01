name: uFinda Mobile CI/CD

on:
  push:
    branches:
      - mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELLA_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0
      
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        run: npm install

      # - name: Build Android
      #   run: eas build --platform android --profile development --non-interactive
      #   env:
      #     EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Build iOS
        run: eas build --platform ios --profile development --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
